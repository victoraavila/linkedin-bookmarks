[project]
name = "linkedin-bookmarks"
version = "0.1.0"
description = "Local, searchable archive of your LinkedIn saved posts with a fresh-sync engine and an MCP server for OpenCode"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "mcp>=1.2.0",
    "browser-cookie3>=0.19.1",
    "patchright>=1.49.0",
]

[project.scripts]
lbm = "lbm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lbm"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
